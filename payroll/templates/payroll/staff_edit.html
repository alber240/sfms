{% extends 'base.html' %}

{% block title %}Edit Staff - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>✏️ Edit Staff Member</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Staff ID</label>
                <input type="text" value="{{ staff.staff_id }}" disabled>
            </div>
            
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" value="{{ staff.name }}" required>
            </div>
            
            <div class="form-group">
                <label>Position *</label>
                <input type="text" name="position" value="{{ staff.position }}" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Monthly Salary (LRD)</label>
                    <input type="number" name="monthly_salary_lrd" step="0.01" value="{{ staff.monthly_salary_lrd }}">
                </div>
                <div class="form-group">
                    <label>Monthly Salary (USD)</label>
                    <input type="number" name="monthly_salary_usd" step="0.01" value="{{ staff.monthly_salary_usd }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone" value="{{ staff.phone }}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ staff.email }}">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Staff</button>
                <a href="{% url 'staff_list' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; margin-top: 50px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
.btn-primary { background: #1e3c72; }
</style>
{% endblock %}
