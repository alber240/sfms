{% extends 'base.html' %}

{% block title %}Add Staff - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>➕ Add Staff Member</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Staff ID *</label>
                <input type="text" name="staff_id" required placeholder="e.g., STF001">
            </div>
            
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" required>
            </div>
            
            <div class="form-group">
                <label>Position *</label>
                <input type="text" name="position" required placeholder="e.g., Teacher, Admin">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Monthly Salary (LRD)</label>
                    <input type="number" name="monthly_salary_lrd" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label>Monthly Salary (USD)</label>
                    <input type="number" name="monthly_salary_usd" step="0.01" value="0">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone">
                </div>
                           <div class="form-group">
                <label>Email (for payroll receipts)</label>
                <input type="email" name="email" value="{{ staff.email }}" placeholder="teacher@school.com">
                <small>Receipts will be sent to this email when processing payroll</small>
            </div>
            </div>
            
            <div class="form-group">
                <label>Hire Date *</label>
                <input type="date" name="hire_date" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Staff</button>
                <a href="{% url 'staff_list' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; margin-top: 50px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
.btn-primary { background: #1e3c72; }
</style>
{% endblock %}
