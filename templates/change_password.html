{% extends 'base.html' %}

{% block title %}Change Password - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2>🔐 Change Your Password</h2>
        <p>This is your first login. Please set a new password.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" required class="form-control">
                <small>Minimum 8 characters</small>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.btn-primary { background: #1e3c72; color: white; border: none; padding: 10px 20px; cursor: pointer; }
</style>
{% endblock %}
