{% extends 'base.html' %}

{% block title %}Delete Item - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto; text-align: center;">
        <h2>⚠️ Confirm Delete</h2>
        <p>Are you sure you want to delete <strong>{{ item.name }}</strong>?</p>
        <p style="color: red;">This action cannot be undone.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'inventory_list' %}" class="btn">Cancel</a>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
.btn-danger { background: #dc3545; }
</style>
{% endblock %}
