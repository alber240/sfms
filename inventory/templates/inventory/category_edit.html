{% extends 'base.html' %}

{% block title %}Edit Category - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2>✏️ Edit Category</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" name="name" value="{{ category.name }}" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Category</button>
                <a href="{% url 'inventory_category_list' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
.btn-primary { background: #1e3c72; }
</style>
{% endblock %}
