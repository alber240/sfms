{% extends 'base.html' %}

{% block title %}Edit Item - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>✏️ Edit Item: {{ item.name }}</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Item Name *</label>
                <input type="text" name="name" value="{{ item.name }}" required>
            </div>
            
            <div class="form-group">
                <label>Category</label>
                <select name="category">
                    <option value="">No Category</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if item.category.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" name="quantity" value="{{ item.quantity }}" step="1">
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" name="unit" value="{{ item.unit }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Unit Price (LRD)</label>
                    <input type="number" name="unit_price_lrd" step="0.01" value="{{ item.unit_price_lrd }}">
                </div>
                <div class="form-group">
                    <label>Unit Price (USD)</label>
                    <input type="number" name="unit_price_usd" step="0.01" value="{{ item.unit_price_usd }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Low Stock Alert</label>
                    <input type="number" name="low_stock_threshold" value="{{ item.low_stock_threshold }}">
                </div>
                <div class="form-group">
                    <label>Storage Location</label>
                    <input type="text" name="location" value="{{ item.location }}">
                </div>
            </div>
            
            <div class="form-group">
                <label>Notes</label>
                <textarea name="notes" rows="3">{{ item.notes }}</textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Item</button>
                <a href="{% url 'inventory_list' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; margin-top: 50px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
.btn-primary { background: #1e3c72; }
</style>
{% endblock %}
