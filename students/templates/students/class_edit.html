{% extends 'base.html' %}

{% block title %}Edit Class - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <h2>✏️ Edit Class</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Class Name *</label>
                <input type="text" name="name" value="{{ class.name }}" required>
            </div>
            
            <div class="form-group">
                <label>Section</label>
                <input type="text" name="section" value="{{ class.section }}">
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Class</button>
                <a href="{% url 'class_list' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; margin-top: 50px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; margin-right: 10px; }
.btn-primary { background: #1e3c72; }
.alert { padding: 12px; border-radius: 5px; margin-bottom: 20px; background: #d4edda; color: #155724; }
</style>
{% endblock %}
