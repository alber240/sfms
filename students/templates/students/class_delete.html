{% extends 'base.html' %}

{% block title %}Delete Class - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
        <h2>⚠️ Confirm Delete</h2>
        <p>Are you sure you want to delete class <strong>{{ class.name }}</strong>?</p>
        <p style="color: red;">This action cannot be undone.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'class_list' %}" class="btn">Cancel</a>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; margin-top: 50px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; margin: 5px; }
.btn-danger { background: #dc3545; }
</style>
{% endblock %}
