{% extends 'base.html' %}

{% block title %}Add Student - SFMS{% endblock %}

{% block content %}
<div class="container">
    <h1>Add New Student</h1>
    
    <form method="post" class="form">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Admission Number *</label>
            <input type="text" name="admission_number" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" name="first_name" required>
            </div>
            
            <div class="form-group">
                <label>Last Name *</label>
                <input type="text" name="last_name" required>
            </div>
        </div>
        
        <div class="form-group">
            <label>Class</label>
            <select name="class_assigned">
                <option value="">Select Class</option>
                {% for class in classes %}
                <option value="{{ class.id }}">{{ class.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label>Student Type *</label>
            <select name="student_type" required>
                <option value="NEW">New Student</option>
                <option value="OLD">Returning Student</option>
            </select>
            <small>Select "New Student" for first-time enrollment, "Returning Student" for continuing students</small>
        </div>
        
        <div class="form-group">
            <label>Parent Name</label>
            <input type="text" name="parent_name">
        </div>
        
        <div class="form-group">
            <label>Parent Phone</label>
            <input type="tel" name="parent_phone">
        </div>
        
        <div class="form-group">
            <label>Alternative Phone</label>
            <input type="tel" name="parent_phone_alternative">
        </div>
        
        <div class="form-group">
            <label>Address</label>
            <textarea name="address" rows="3"></textarea>
        </div>
        
        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="2"></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="{% url 'student_list' %}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
