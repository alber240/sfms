{% extends 'base.html' %}

{% block title %}Add Fee Category - SFMS{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 50px auto;">
        <h2>➕ Add Fee Category</h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" name="name" required placeholder="e.g., Tuition, Registration, Laboratory">
            </div>
            <div class="form-group">
                <label>Category Code</label>
                <input type="text" name="code" required placeholder="e.g., TUI, REG, LAB" maxlength="10">
                <small>Short code for easy identification</small>
            </div>
            <button type="submit" class="btn btn-primary">Add Category</button>
            <a href="{% url 'manage_categories' %}" class="btn">Cancel</a>
        </form>
    </div>
</div>

<style>
.card { background: white; padding: 30px; border-radius: 10px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
.btn { display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
.btn-primary { background: #1e3c72; }
</style>
{% endblock %}
